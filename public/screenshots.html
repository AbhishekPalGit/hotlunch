<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screenshots Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .screenshot-container {
            margin-bottom: 40px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .screenshot-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #006D77;
        }
        img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>HotLunch Screenshots</h1>
    
    <div class="screenshot-container">
        <div class="screenshot-title">Screenshot 1 (Login Screen)</div>
        <img src="screenshot_1.png" alt="Screenshot 1">
    </div>
    
    <div class="screenshot-container">
        <div class="screenshot-title">Screenshot 2</div>
        <img src="screenshot_2.png" alt="Screenshot 2">
    </div>
    
    <div class="screenshot-container">
        <div class="screenshot-title">Screenshot 3</div>
        <img src="screenshot_3.png" alt="Screenshot 3">
    </div>
    
    <div class="screenshot-container">
        <div class="screenshot-title">Screenshot 4</div>
        <img src="screenshot_4.png" alt="Screenshot 4">
    </div>
    
    <div class="screenshot-container">
        <div class="screenshot-title">Screenshot 5</div>
        <img src="screenshot_5.png" alt="Screenshot 5">
    </div>
    
    <div class="screenshot-container">
        <div class="screenshot-title">Screenshot 6</div>
        <img src="screenshot_6.png" alt="Screenshot 6">
    </div>
    
    <div class="screenshot-container">
        <div class="screenshot-title">Screenshot 7</div>
        <img src="screenshot_7.png" alt="Screenshot 7">
    </div>
    
    <div class="screenshot-container">
        <div class="screenshot-title">Screenshot 8</div>
        <img src="screenshot_8.png" alt="Screenshot 8">
    </div>
    
    <div class="screenshot-container">
        <div class="screenshot-title">Screenshot 9</div>
        <img src="screenshot_9.png" alt="Screenshot 9">
    </div>
    
    <div class="screenshot-container">
        <div class="screenshot-title">Screenshot 10</div>
        <img src="screenshot_10.png" alt="Screenshot 10">
    </div>
    
    <div class="screenshot-container">
        <div class="screenshot-title">Screenshot 11</div>
        <img src="screenshot_11.png" alt="Screenshot 11">
    </div>
</body>
</html>
